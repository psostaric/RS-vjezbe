<main class="card">
  <h1>{{ title }}</h1>

  <form (ngSubmit)="add()" class="add">
    <input name="text" [(ngModel)]="newText" placeholder="Novi zadatak..." autocomplete="off" />
    <button type="submit">Dodaj</button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }} <button (click)="load()">Pokušaj ponovno</button></p>
  }

  @if (loading()) {
    <p class="empty">Učitavanje... (prvi zahtjev na Renderu može trajati do minute)</p>
  } @else if (tasks().length === 0) {
    <p class="empty">Nema zadataka.</p>
  } @else {
    <ul>
      @for (t of tasks(); track t.id) {
        <li [class.done]="t.done">
          <label>
            <input type="checkbox" [checked]="t.done" (change)="toggle(t)" />
            <span>{{ t.text }}</span>
          </label>
          <button class="del" (click)="remove(t.id)" aria-label="Obriši">✕</button>
        </li>
      }
    </ul>
    <p class="count">Preostalo: {{ remaining() }} / {{ tasks().length }}</p>
  }
</main>
